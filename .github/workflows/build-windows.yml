name: Build Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Tests and syntax
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q renamix tests scripts packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable and SHA-256
        run: python scripts/build_windows.py
      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath dist/Renamix.exe -ErrorAction Stop
          if ($exe.Length -le 0) { throw 'Empty executable' }
          $expected = (Get-Content dist/Renamix.exe.sha256).Split(' ')[0]
          if ((Get-FileHash dist/Renamix.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Checksum mismatch' }
      - uses: actions/upload-artifact@v7
        with:
          name: Renamix-Windows-x64
          path: |
            dist/Renamix.exe
            dist/Renamix.exe.sha256
            dist/LICENSE
          if-no-files-found: error
          retention-days: 14
